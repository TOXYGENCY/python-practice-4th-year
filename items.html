<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="m-4">
    {% if is_active %}
        <h2><a href="/">Hello {{ name }}</a></h2>
        <ul>
            {% for item in items %}
                <li><span class="badge text-bg-warning">{{ item | capitalize }}</span></li>
            {% endfor %}
        </ul>

        <h1 class="badge text-bg-success font-monospace">IS ACTIVE</h1>
    {% else %}
        <div class=" d-flex flex-column align-items-center">
            <h1>Ошибка 403: У Вас нет доступа к этой странице.</h1>
            <h1 class="badge text-bg-danger font-monospace">NOT ACTIVE</h1>
        </div>
    {% endif %}

</body>
</html>
